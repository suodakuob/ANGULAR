<!-- src/app/auth/login/login.component.html -->
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4">Connexion</h3>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Adresse Email</label>
            <input type="email" id="email" class="form-control" formControlName="email"
                   [ngClass]="{ 'is-invalid': f['email'].touched && f['email'].errors }">
            <div *ngIf="f['email'].touched && f['email'].errors" class="invalid-feedback">
              <div *ngIf="f['email'].errors?.['required']">L'email est requis.</div>
              <div *ngIf="f['email'].errors?.['email']">Format d'email invalide.</div>
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" id="password" class="form-control" formControlName="password"
                   [ngClass]="{ 'is-invalid': f['password'].touched && f['password'].errors }">
            <div *ngIf="f['password'].touched && f['password'].errors" class="invalid-feedback">
              <div *ngIf="f['password'].errors?.['required']">Le mot de passe est requis.</div>
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger mt-3 py-2">
            {{ errorMessage }}
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
