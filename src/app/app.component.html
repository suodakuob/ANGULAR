<!-- src/app/app.component.html -->
<app-notification></app-notification> <!-- Le composant de notification en haut -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/products">
      <i class="bi bi-box-seam-fill me-2"></i> <!-- Optionnel: Icône Bootstrap -->
      GestProd
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item" *ngIf="isLoggedIn$ | async">
          <a class="nav-link" routerLink="/products" routerLinkActive="active">Produits</a>
        </li>
        <!-- Tu pourrais ajouter d'autres liens ici si l'utilisateur est connecté -->
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item" *ngIf="!(isLoggedIn$ | async)">
          <a class="nav-link" routerLink="/login" routerLinkActive="active">
            <i class="bi bi-box-arrow-in-right me-1"></i> <!-- Optionnel: Icône Bootstrap -->
            Connexion
          </a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn$ | async">
          <a class="nav-link" style="cursor: pointer;" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i> <!-- Optionnel: Icône Bootstrap -->
            Déconnexion
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4 mb-5">
  <router-outlet></router-outlet>
</div>
