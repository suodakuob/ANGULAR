<!-- src/app/app.component.html -->
<app-notification></app-notification>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" routerLink="/products">
      <i class="bi bi-box-seam-fill me-2"></i>
      ProductManager Pro
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item" *ngIf="isLoggedIn$ | async">
          <a class="nav-link" routerLink="/products" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <i class="bi bi-list-ul me-1"></i>Liste des Produits
          </a>
        </li>
        <!-- MODIFIÉ: Afficher "Ajouter Produit" seulement si admin -->
        <li class="nav-item" *ngIf="isAdmin$ | async">
          <a class="nav-link" routerLink="/product/new" routerLinkActive="active">
            <i class="bi bi-plus-circle-dotted me-1"></i>Ajouter Produit
          </a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item" *ngIf="isLoggedIn$ | async">
          <a class="nav-link position-relative" routerLink="/cart" routerLinkActive="active">
            <i class="bi bi-cart-fill me-1"></i>Panier
            <span *ngIf="(cartItemCount$ | async) as count"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              {{ count > 0 ? count : '' }}
              <span *ngIf="count === 0" class="visually-hidden">Panier vide</span>
            </span>
          </a>
        </li>
        <li class="nav-item" *ngIf="!(isLoggedIn$ | async)">
          <a class="nav-link" routerLink="/login" routerLinkActive="active">
            <i class="bi bi-box-arrow-in-right me-1"></i>
            Connexion
          </a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn$ | async">
          <a class="nav-link" style="cursor: pointer;" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i>
            Déconnexion
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4 mb-5">
  <router-outlet></router-outlet>
</div>

<footer class="footer mt-auto py-3 bg-light text-center text-muted border-top">
    <div class="container">
        <span>© {{ currentYear }} ProductManager Pro. Tous droits réservés.</span>
    </div>
</footer>
